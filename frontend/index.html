<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Planning Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        button { background: #28a745; color: white; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
        button:hover { background: #218838; }
        ul { list-style: none; padding: 0; }
        li { background: #fff; border: 1px solid #eee; margin-bottom: 10px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        
        /* Interactive Calendar Design */
        .calendar-container { max-width: 600px; margin: 30px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; margin-top: 15px; }
        .calendar-header-cell { font-weight: bold; color: #555; background: #e9ecef; padding: 8px 5px; border-radius: 4px; font-size: 0.9rem; }
        .calendar-cell { background: #f8f9fa; border: 1px solid #e2e8f0; padding: 10px 2px; border-radius: 6px; min-height: 55px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; transition: 0.2s; }
        .calendar-cell:hover { background: #edf2f7; }
        .calendar-cell.blank { background: transparent; border: none; }
        .day-number { font-weight: bold; color: #2d3748; font-size: 1rem; }
        .status-icon { font-size: 1.2rem; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📝 Work Planning Dashboard</h2>
        <input type="text" id="taskTitle" placeholder="Task ka naam likhein...">
        <input type="text" id="taskDesc" placeholder="Task ki details/description...">
        <input type="date" id="taskDate">
        <button onclick="addTask()">Add New Task</button>

        <ul id="taskList"></ul>
    </div>

    <div class="calendar-container">
        <h3 style="text-align: center; margin: 0; color: #2d3748;" id="calendar-month-year">Calendar Tracker</h3>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <script>
        const apiUrl = "https://work-planning-api.onrender.com/tasks";

       
        async function fetchTasks() {
            try {
                const res = await fetch(apiUrl);
                if (!res.ok) throw new Error("Network response main dikkat hai");
                const tasks = await res.json();
                
                const taskList = document.getElementById("taskList");
                taskList.innerHTML = "";
                
                tasks.forEach(task => {
                    const li = document.createElement("li");
                    const isChecked = task.completed ? "checked" : "";
                    const textStyle = task.completed ? "text-decoration: line-through; color: #a0aec0;" : "";

                    // Safe integration using 'this.checked' to avoid console crashes
                    li.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px;">
                            <div style="flex: 1;">
                                <input type="checkbox" ${isChecked} onchange="toggleTask('${task._id}', this.checked)" style="cursor: pointer; transform: scale(1.3); margin-right: 12px; vertical-align: middle;">
                                <span style="${textStyle} font-weight: bold; font-size: 1.1rem; vertical-align: middle;">${task.title}</span>
                                <p style="margin: 6px 0 0 32px; color: #4a5568; font-size: 0.95rem;">${task.description || "No description"}</p>
                                <small style="margin-left: 32px; color: #e53e3e; font-weight: bold; display: block; margin-top: 6px;">
                                    📅 Due Date: ${task.dueDate ? task.dueDate : "No date set"}
                                </small>
                            </div>
                            <button onclick="deleteTask('${task._id}')" style="background: #e53e3e; color: white; border: none; padding: 6px 12px; border-radius: 4px; width: auto; margin: 0; font-size: 0.9rem;">Delete</button>
                        </div>
                    `;
                    taskList.appendChild(li);
                });

                renderCalendar(tasks);
            } catch (error) {
                console.error("Tasks load karne mein error aaya:", error);
            }
        }

       
        async function addTask() {
            const titleInput = document.getElementById("taskTitle");
            const descInput = document.getElementById("taskDesc");
            const dateInput = document.getElementById("taskDate");

            if (!titleInput.value) {
                alert("Task ka Title likhna zaroori hai!");
                return;
            }

            const newTask = {
                title: titleInput.value,
                description: descInput.value,
                dueDate: dateInput.value
            };

            try {
                await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(newTask)
                });

                titleInput.value = "";
                descInput.value = "";
                dateInput.value = "";
                fetchTasks();
            } catch (error) {
                console.error("Add task failed:", error);
            }
        }

      
        async function toggleTask(id, isChecked) {
            try {
                await fetch(`${apiUrl}/${id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ completed: isChecked })
                });
                fetchTasks(); 
            } catch (error) {
                console.error("Toggle task failed:", error);
            }
        }

        
        async function deleteTask(id) {
            try {
                await fetch(`${apiUrl}/${id}`, { method: "DELETE" });
                fetchTasks();
            } catch (error) {
                console.error("Delete task failed:", error);
            }
        }

       
        function renderCalendar(tasks) {
            const calendarGrid = document.getElementById("calendarGrid");
            calendarGrid.innerHTML = "";
            
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById("calendar-month-year").innerText = `📅 ${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            
            const daysOfWeek = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            daysOfWeek.forEach(day => {
                calendarGrid.innerHTML += `<div class="calendar-header-cell">${day}</div>`;
            });

            for (let i = 0; i < firstDayIndex; i++) {
                calendarGrid.innerHTML += `<div class="calendar-cell blank"></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const monthStr = String(month + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateStr = `${year}-${monthStr}-${dayStr}`;

                
                const dayTasks = tasks.filter(t => t.dueDate && t.dueDate.startsWith(dateStr));
                let statusIcon = "";
                
                if (dayTasks.length > 0) {
                    const allCompleted = dayTasks.every(t => t.completed === true);
                    if (allCompleted) {
                        statusIcon = "✅"; 
                    } else {
                        const todayStr = new Date().toISOString().split('T')[0];
                        if (dateStr < todayStr) {
                            statusIcon = "❌"; 
                        } else {
                            statusIcon = "🟡"; 
                        }
                    }
                }

                calendarGrid.innerHTML += `
                    <div class="calendar-cell">
                        <span class="day-number">${day}</span>
                        <span class="status-icon">${statusIcon}</span>
                    </div>
                `;
            }
        }

        fetchTasks();
    </script>
</body>
</html>
